app.patch('/api/schedules/:id/cancel', authRequired, requireRoles('admin','operativo','supervisor_flotas'), async (req, res) => {
  const found = await pool.query(`SELECT sr.*, COALESCE(g.empresa, sr.empresa) AS empresa FROM schedule_requests sr LEFT JOIN garantias g ON g.id = sr.garantia_id WHERE sr.id=$1`, [req.params.id]);
  if (!found.rowCount) return res.status(404).json({ error:'Programación no encontrada.' });
  if (req.user.role === 'supervisor_flotas' && normalizeIdentityValue(found.rows[0].empresa||'') !== normalizeIdentityValue(req.user.empresa||'')) return res.status(403).json({ error:'No puedes cancelar programaciones de otra empresa.' });
  const notes = String(req.body.notes || 'Cancelada').trim();
  const result = await pool.query(`UPDATE schedule_requests SET status='cancelled', notes=COALESCE(NULLIF($2,''),notes), updated_at=NOW() WHERE id=$1 RETURNING *`, [req.params.id, notes]);
  res.json(scheduleSummary(result.rows[0]));
});

app.patch('/api/schedules/:id/reschedule', authRequired, requireRoles('admin','operativo','supervisor_flotas'), async (req, res) => {
  const scheduledFor = req.body.scheduledFor ? new Date(req.body.scheduledFor) : null;
  if (!scheduledFor || Number.isNaN(scheduledFor.getTime())) return res.status(400).json({ error:'Fecha y hora inválidas.' });
  const found = await pool.query(`SELECT sr.*, COALESCE(g.empresa,sr.empresa) AS empresa FROM schedule_requests sr LEFT JOIN garantias g ON g.id=sr.garantia_id WHERE sr.id=$1`, [req.params.id]);
  if (!found.rowCount) return res.status(404).json({ error:'Programación no encontrada.' });
  if (req.user.role === 'supervisor_flotas' && normalizeIdentityValue(found.rows[0].empresa||'') !== normalizeIdentityValue(req.user.empresa||'')) return res.status(403).json({ error:'No puedes reprogramar unidades de otra empresa.' });
  const busy = await pool.query(`SELECT id FROM schedule_requests WHERE id<>$1 AND status='confirmed' AND DATE(scheduled_for AT TIME ZONE 'UTC')=DATE($2::timestamptz AT TIME ZONE 'UTC') AND TO_CHAR(scheduled_for AT TIME ZONE 'UTC','HH24:MI')=TO_CHAR($2::timestamptz AT TIME ZONE 'UTC','HH24:MI') LIMIT 1`, [req.params.id, scheduledFor.toISOString()]);
  if (busy.rowCount) return res.status(409).json({ error:'Ese horario ya está ocupado.' });
  const result = await pool.query(`UPDATE schedule_requests SET status='proposed', scheduled_for=$2, proposed_at=NOW(), confirmed_at=NULL, updated_at=NOW() WHERE id=$1 RETURNING *`, [req.params.id, scheduledFor.toISOString()]);
  res.json(scheduleSummary(result.rows[0]));
});

app.post('/api/whatsapp/incoming'"""
